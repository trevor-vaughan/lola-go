version: "2"
linters:
  enable: [errorlint, gosec, misspell, bodyclose, unconvert, depguard, forbidigo]
  settings:
    # depguard lets internal/market import source, yamldoc, manifest and module for their lexical
    # rules; these are the functions of theirs that reach the disk, the network or git, which no
    # catalog string may (Plan 6c §6.1, ruling R-6c-10). Scoped to internal/market by the
    # exclusion below.
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^source\.(Parse|Fetch|FetchFile|CheckReachable|GitCommand|InWorkTree|WorkTree|IsWithin|SameLocation)$
          pkg: ^github\.com/trevor-vaughan/lola-go/internal/source$
          msg: internal/market classifies sources from their text alone; the engine looks them up and fetches
        - pattern: ^yamldoc\.(Read|ReadNoFollow)$
          pkg: ^github\.com/trevor-vaughan/lola-go/internal/yamldoc$
          msg: internal/market decodes bytes the engine read (yamldoc.Decode)
        - pattern: ^manifest\.(Load|Edit)$
          pkg: ^github\.com/trevor-vaughan/lola-go/internal/manifest$
          msg: internal/market maps entries; the engine reads and writes manifests
        - pattern: ^module\.(Load|Detect|Normalize)$
          pkg: ^github\.com/trevor-vaughan/lola-go/internal/module$
          msg: internal/market uses module's name rules only; the engine loads modules
    depguard:
      rules:
        # Targets are pure renderers behind the target contract: they may not reach into the
        # engine, the CLI or lola's state, so each can grow without touching the core.
        targets:
          list-mode: strict
          files:
            - "**/internal/target/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/trevor-vaughan/lola-go/internal/target$ # the contract only, not a sibling target
            - github.com/trevor-vaughan/lola-go/internal/module
            - github.com/trevor-vaughan/lola-go/internal/paths
            - github.com/trevor-vaughan/lola-go/internal/plan
            - github.com/trevor-vaughan/lola-go/internal/untrusted # sanitizing author text in findings
            - go.yaml.in/yaml/v3
            - github.com/BurntSushi/toml
            - golang.org/x/mod/semver
        # Profiles are read, never fetched or written (Plan 6b §6.1): no network, no engine,
        # no state but the profile files themselves.
        profile:
          list-mode: strict
          files:
            - "**/internal/profile/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/trevor-vaughan/lola-go/internal/errs
            - github.com/trevor-vaughan/lola-go/internal/fsx # a project's profiles directory stays inside it
            - github.com/trevor-vaughan/lola-go/internal/manifest
            - github.com/trevor-vaughan/lola-go/internal/module # name rules
            - github.com/trevor-vaughan/lola-go/internal/paths
            - github.com/trevor-vaughan/lola-go/internal/source # a remote profile's pin rules, never a fetch
            - github.com/trevor-vaughan/lola-go/internal/untrusted
            - github.com/trevor-vaughan/lola-go/internal/yamldoc
            - go.yaml.in/yaml/v3
        # Catalogs are a stranger's input, classified from their text alone (Plan 6c §6.1, ruling
        # R-6c-10): no file system, so no catalog string can reach the disk from here.
        market:
          list-mode: strict
          files:
            - "**/internal/market/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/trevor-vaughan/lola-go/internal/errs
            - github.com/trevor-vaughan/lola-go/internal/manifest
            - github.com/trevor-vaughan/lola-go/internal/module # name rules
            - github.com/trevor-vaughan/lola-go/internal/source # lexical rules, never a fetch
            - github.com/trevor-vaughan/lola-go/internal/untrusted
            - github.com/trevor-vaughan/lola-go/internal/yamldoc
            - go.yaml.in/yaml/v3
          deny:
            - pkg: os
              desc: the market package reads no files; the engine does (Plan 6c §6.1)
            - pkg: io/fs
              desc: the market package reads no files; the engine does (Plan 6c §6.1)
        # The trash moves and copies what lola takes out of a destination; it decides nothing, so it
        # needs no state, no engine and no target (Plan 6d §6.1).
        trash:
          list-mode: strict
          files:
            - "**/internal/trash/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/trevor-vaughan/lola-go/internal/errs
            - github.com/trevor-vaughan/lola-go/internal/untrusted
        # The active-list names lock.json stores: a leaf the ledger imports, so it reads no YAML.
        activeprofile:
          list-mode: strict
          files:
            - "**/internal/activeprofile/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/trevor-vaughan/lola-go/internal/module # name rules
            - github.com/trevor-vaughan/lola-go/internal/untrusted
        # Templates are a stranger's input rendered in-process (Plan 7 §5): the sandbox reads no
        # files and opens no connection, so a template cannot reach the disk or the network.
        templating:
          list-mode: strict
          files:
            - "**/internal/templating/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/osteele/liquid # and its packages
            - github.com/trevor-vaughan/lola-go/internal/untrusted
          deny:
            - pkg: os
              desc: the templating package reads no files; the engine does (Plan 7 §5)
            - pkg: io/fs
              desc: the templating package reads no files; the engine does (Plan 7 §5)
            - pkg: net
              desc: the templating package opens no connection (Plan 7 §5)
            - pkg: os/exec
              desc: the templating package runs no program (Plan 7 §5)
            - pkg: io/ioutil
              desc: the templating package reads no files; the engine does (Plan 7 §5)
            - pkg: syscall
              desc: the templating package makes no system call (Plan 7 §5)
            - pkg: unsafe
              desc: the templating package stays inside Go's memory safety (Plan 7 §5)
            - pkg: plugin
              desc: the templating package loads no code (Plan 7 §5)
        # Only the sandbox may import the template engine, so every template is screened, capped and
        # rendered with lola's own filters (Plan 7 §5).
        liquid:
          files:
            - "**"
            - "!**/internal/templating/**"
          deny:
            - pkg: github.com/osteele/liquid
              desc: templates render only through internal/templating (Plan 7 §5)
    errcheck:
      exclude-functions:
        # Human output: a failed write to stdout/stderr has no better channel to report on.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        - G304 # reading paths from the user's project and lola's store is the product's job
        - G301 # rendered project dirs are 0755 like any checked-out tree
        - G302 # rendered project files keep 0644/0755 so teammates' tools can read them
        - G306 # same as G302 for os.WriteFile
        - G204 # git runs with a fixed argv, never through a shell
  exclusions:
    paths:
      - third_party/ # vendored, patched upstream code (third_party/liquid/PATCHES.md)
    rules:
      # forbidigo guards only the pure market package.
      - path-except: internal/market/
        linters: [forbidigo]
      # G504 flags httpoxy in Go < 1.6.3. Specs serve git http-backend through net/http/cgi.
      - path: internal/testenv/
        linters: [gosec]
        text: G504
formatters:
  enable: [gofmt]
  exclusions:
    paths:
      - third_party/
