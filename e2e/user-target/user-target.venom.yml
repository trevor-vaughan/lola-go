name: a user target spec installs a module into a tool lola has no built-in for
# Run by scripts/e2e.sh (task e2e -- user-target) in the shared e2e container: this checkout's
# lola-go at /opt/lola-go/lola-go, the suite at /e2e and e2e/common at /e2e-common. Every step is
# {{.runtime}} exec [<options>] {{.container}} <argv>; any $, glob, redirection or pipe sits
# inside a single-quoted sh -c, and no step names a host path. Cases run in order and read the
# state earlier ones leave. The tool, quill, exists only as a spec file written by setup.sh into
# the user's target directory; no Go change adds it. No assistant is on PATH.
vars:
  root: "."
  runtime: podman
  container: lola-e2e-user-target
  lola: /opt/lola-go/lola-go
  jsoncheck: python3 /e2e-common/jsoncheck.py
  specs: /home/tester/.config/lola/targets
  proj: /work/proj

testcases:
  - name: U1 The quill spec and a project with .quill/ are built
    steps:
      - type: exec
        script: "{{.runtime}} exec {{.container}} bash /e2e/scripts/setup.sh"
        assertions:
          - result.code ShouldEqual 0
          - "result.systemout ShouldEqual \"fixture ready\""

  - name: U2 install --help lists quill after the built-in targets
    steps:
      - type: exec
        script: "{{.runtime}} exec {{.container}} {{.lola}} install --help"
        assertions:
          - result.code ShouldEqual 0
          - "result.systemout ShouldContainSubstring \"comma-separated: claude-code, gemini-cli, opencode, agents, quill)\""

  - name: U3 Installing into quill writes every component at its layout path and drops hooks
    steps:
      - type: exec
        script: "{{.runtime}} exec {{.container}} sh -c '{{.lola}} install /e2e/fixtures/pen -t quill -C {{.proj}} -y --json > /tmp/u3.json 2> /tmp/u3.err; echo exit=$?'"
        assertions:
          - "result.systemout ShouldEqual \"exit=0\""
      - type: exec
        script: |
          {{.runtime}} exec {{.container}} sh -c '{{.jsoncheck}} doc /tmp/u3.json > /dev/null && python3 -c "
          import json
          doc = json.load(open(\"/tmp/u3.json\"))
          want = [f for f in doc[\"findings\"] if f[\"kind\"] == \"agent\" and f[\"severity\"] == \"warn\" and f[\"target\"] == \"quill\"
                  and f[\"text\"].startswith(\"hooks dropped: lola writes hooks and MCP servers into a component only under consent, which quill\")]
          assert len(want) == 1, doc[\"findings\"]
          print(\"ok hooks dropped, warn\")
          "'
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual "ok hooks dropped, warn"
      - type: exec
        script: "{{.runtime}} exec {{.container}} sh -c 'cd {{.proj}}/.quill && find . -type f | sort'"
        assertions:
          - result.code ShouldEqual 0
          - "result.systemout ShouldContainSubstring \"./skills/scribble/SKILL.md\""
          - "result.systemout ShouldContainSubstring \"./commands/ink.md\""
          - "result.systemout ShouldContainSubstring \"./agents/editor.md\""
          - "result.systemout ShouldContainSubstring \"./rules/lola/pen/plain.md\""
      - type: exec
        script: "{{.runtime}} exec {{.container}} sh -c 'grep -c hooks {{.proj}}/.quill/agents/editor.md'"
        assertions:
          - result.code ShouldEqual 1
          - "result.systemout ShouldEqual \"0\""

  - name: U4 list shows the module installed for quill
    steps:
      - type: exec
        script: "{{.runtime}} exec {{.container}} sh -c '{{.lola}} list -C {{.proj}} --json > /tmp/u4.json'"
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: "{{.runtime}} exec {{.container}} {{.jsoncheck}} doc /tmp/u4.json"
        assertions:
          - result.code ShouldEqual 0
          - result.systemoutjson.modules.modules0.name ShouldEqual pen
          - result.systemoutjson.modules.modules0.target ShouldEqual quill

  - name: U5 uninstall removes the files
    steps:
      - type: exec
        script: "{{.runtime}} exec {{.container}} {{.lola}} uninstall pen -C {{.proj}} -y"
        assertions:
          - result.code ShouldEqual 0
          - "result.systemout ShouldContainSubstring \"✓ uninstalled pen (quill)\""
      - type: exec
        script: "{{.runtime}} exec {{.container}} sh -c 'find {{.proj}}/.quill -type f'"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldBeEmpty

  - name: U6 A spec with a built-in's id replaces it, said on stderr in human output only
    steps:
      - type: exec
        script: "{{.runtime}} exec {{.container}} sh -c 'sed \"s/^id: quill/id: opencode/\" {{.specs}}/quill.yaml > {{.specs}}/opencode.yaml'"
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: "{{.runtime}} exec {{.container}} {{.lola}} list -C {{.proj}}"
        assertions:
          - result.code ShouldEqual 0
          - "result.systemerr ShouldContainSubstring \"note: opencode uses your target spec {{.specs}}/opencode.yaml in place of lola's built-in\""
      - type: exec
        script: "{{.runtime}} exec {{.container}} sh -c '{{.lola}} list -C {{.proj}} --json > /dev/null 2> /tmp/u6.err; echo exit=$?; ! grep -q \"in place of\" /tmp/u6.err'"
        assertions:
          - result.code ShouldEqual 0
          - "result.systemout ShouldEqual \"exit=0\""
      - type: exec
        script: "{{.runtime}} exec {{.container}} rm {{.specs}}/opencode.yaml"
        assertions:
          - result.code ShouldEqual 0

  - name: U7 A spec that cannot be loaded stops every command, naming the file and a hint
    steps:
      - type: exec
        script: "{{.runtime}} exec {{.container}} rm -f {{.specs}}/opencode.yaml"
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: "{{.runtime}} exec {{.container}} sh -c 'echo \"id: broken\" > {{.specs}}/broken.yaml'"
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: "{{.runtime}} exec {{.container}} {{.lola}} version"
        assertions:
          - result.code ShouldEqual 1
          - "result.systemerr ShouldContainSubstring \"error: \""
          - "result.systemerr ShouldContainSubstring \"broken.yaml\""
          - "result.systemerr ShouldContainSubstring \"  hint: \""
      - type: exec
        script: "{{.runtime}} exec {{.container}} sh -c '{{.lola}} version --json > /tmp/u7.out 2> /tmp/u7.err; echo exit=$?'"
        assertions:
          - "result.systemout ShouldEqual \"exit=1\""
      - type: exec
        script: "{{.runtime}} exec {{.container}} {{.jsoncheck}} refusal /tmp/u7.out /tmp/u7.err"
        assertions:
          - result.code ShouldEqual 0
          - "result.systemoutjson.error ShouldContainSubstring \"broken.yaml\""
      - type: exec
        script: "{{.runtime}} exec {{.container}} rm {{.specs}}/broken.yaml"
        assertions:
          - result.code ShouldEqual 0

  - name: U8 A .yml spec is refused with the rename hint
    steps:
      - type: exec
        script: "{{.runtime}} exec {{.container}} rm -f {{.specs}}/broken.yaml"
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: "{{.runtime}} exec {{.container}} cp {{.specs}}/quill.yaml {{.specs}}/quill2.yml"
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: "{{.runtime}} exec {{.container}} {{.lola}} list -C {{.proj}}"
        assertions:
          - result.code ShouldEqual 1
          - "result.systemerr ShouldContainSubstring \"quill2.yml\""
          - "result.systemerr ShouldContainSubstring \"hint: rename it to quill2.yaml: lola reads target specs only from .yaml files\""
      - type: exec
        script: "{{.runtime}} exec {{.container}} rm {{.specs}}/quill2.yml"
        assertions:
          - result.code ShouldEqual 0
