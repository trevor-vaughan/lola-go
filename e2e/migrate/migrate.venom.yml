name: lola migrate against the real Python lola
# Run by scripts/e2e.sh (task e2e -- migrate) in the shared e2e container: the Python lola at the
# pinned upstream commit, this checkout's lola-go at /opt/lola-go/lola-go, the suite at /e2e,
# e2e/common at /e2e-common, and a git server on 127.0.0.1:8765 serving /srv/git. Every step is
# {{.runtime}} exec [<options>] {{.container}} <argv>; any $, glob, &&, redirection or pipe sits
# inside a single-quoted sh -c or python3 -c, and no step names a host path.
# Scenario B's steps give the Python lola and lola-go the home /home/b with its own XDG
# directories (b_env); scenario C's the home /home/c, with /home/c/bin first on PATH (c_env).
vars:
  root: "."
  runtime: podman
  container: lola-e2e-migrate
  lola: /opt/lola-go/lola-go
  b_env: -e HOME=/home/b -e XDG_CONFIG_HOME=/home/b/.config -e XDG_DATA_HOME=/home/b/.local/share -e XDG_CACHE_HOME=/home/b/.cache -e XDG_STATE_HOME=/home/b/.local/state
  c_env: -e HOME=/home/c -e XDG_CONFIG_HOME=/home/c/.config -e XDG_DATA_HOME=/home/c/.local/share -e XDG_CACHE_HOME=/home/c/.cache -e XDG_STATE_HOME=/home/c/.local/state -e PATH=/home/c/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

testcases:
  - name: The Python lola installs folder, git and zip modules for four assistants and at user scope
    steps:
      - type: exec
        script: "{{.runtime}} exec {{.container}} bash /e2e/scripts/python-setup.sh"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "python lola installed"
      - type: exec
        script: "{{.runtime}} exec {{.container}} python3 /e2e-common/snapshot.py /tmp/before.json /work/proj /home/tester"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "snapshot:"

  - name: A dry run shows the plan and writes nothing
    steps:
      - type: exec
        script: "{{.runtime}} exec {{.container}} {{.lola}} migrate --dry-run"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "plan (dry run; nothing was written):"
          - result.systemout ShouldContainSubstring "install review (claude-code, gemini-cli, opencode)"
          - result.systemout ShouldContainSubstring "unmappable kit (cursor)"
          - result.systemout ShouldContainSubstring "kept with kit for cursor, which lola-go cannot migrate"
          - 'result.systemout ShouldContainSubstring "marketplaces:"'
          - result.systemout ShouldContainSubstring "register general from http://127.0.0.1:8765/market.git"
          - 'result.systemout ShouldContainSubstring "not registered: off (git+http://127.0.0.1:8765/market.git): it is disabled in the Python lola"'
          - 'result.systemout ShouldContainSubstring "lola migrate gives the command that registers it once its run finds the catalog file the Python lola read"'
      - type: exec
        script: "{{.runtime}} exec {{.container}} sh -c 'python3 /e2e-common/snapshot.py /tmp/dry.json /work/proj /home/tester && cmp /tmp/before.json /tmp/dry.json'"
        assertions:
          - result.code ShouldEqual 0

  - name: Off a terminal without -y it refuses with the hint and writes nothing
    steps:
      - type: exec
        script: "{{.runtime}} exec {{.container}} {{.lola}} migrate"
        assertions:
          - result.code ShouldEqual 1
          - result.systemerr ShouldContainSubstring "lola migrate -y"
      - type: exec
        script: "{{.runtime}} exec {{.container}} sh -c 'python3 /e2e-common/snapshot.py /tmp/refused.json /work/proj /home/tester && cmp /tmp/before.json /tmp/refused.json'"
        assertions:
          - result.code ShouldEqual 0

  - name: G1 Off a terminal under --json the refusal is one JSON line carrying the plan, and writes nothing
    steps:
      - type: exec
        script: "{{.runtime}} exec {{.container}} sh -c '{{.lola}} migrate -n --json > /tmp/g1-dry.json'"
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: "{{.runtime}} exec {{.container}} sh -c '{{.lola}} migrate --json < /dev/null > /tmp/g1.out 2> /tmp/g1.err; echo exit=$?'"
        assertions:
          - result.systemout ShouldEqual "exit=1"
      - type: exec
        script: |
          {{.runtime}} exec {{.container}} python3 -c '
          import json
          out, err = open("/tmp/g1.out").read(), open("/tmp/g1.err").read()
          assert out == "", "stdout: " + out
          assert err.endswith("\n") and err.count("\n") == 1, "stderr: " + err
          doc, dry = json.loads(err), json.load(open("/tmp/g1-dry.json"))
          assert doc.pop("error") == "lola migrate needs confirmation, and there is no terminal to ask on", doc
          assert doc.pop("hints") == ["lola migrate --json -y"], doc
          assert doc == dry, (doc, dry)
          def nulls(v, at):
              if v is None:
                  raise AssertionError("null at " + at)
              for k, x in (v.items() if isinstance(v, dict) else enumerate(v) if isinstance(v, list) else []):
                  nulls(x, at + "/" + str(k))
          nulls(doc, ""); nulls(dry, "")
          print("ok the refusal carries the plan migrate -n --json prints")
          '
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual "ok the refusal carries the plan migrate -n --json prints"
      - type: exec
        script: "{{.runtime}} exec {{.container}} sh -c 'python3 /e2e-common/snapshot.py /tmp/g1.json /work/proj /home/tester && cmp /tmp/before.json /tmp/g1.json'"
        assertions:
          - result.code ShouldEqual 0

  - name: lola migrate installs, replaces with backup and cleans up (§12.7 checks)
    steps:
      - type: exec
        script: "{{.runtime}} exec {{.container}} sh -c '{{.lola}} migrate -y --json > /tmp/result.json'"
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: "{{.runtime}} exec {{.container}} python3 /e2e/scripts/check.py /tmp/before.json /tmp/result.json --home-action keep --untouched /work/proj/.cursor --untouched /work/proj/.claude/skills/lint --untouched /work/proj/.claude/commands/deploy.md --untouched /work/proj/.lola/modules/kit"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldNotContainSubstring "FAIL"
          - result.systemout ShouldContainSubstring "ok every manifest.txt line names a trash path matching the snapshot"
          - result.systemout ShouldContainSubstring "ok every path the Python lola wrote is lola-go's, in the trash, kept, reported or untouched"
          - result.systemout ShouldContainSubstring "ok the unmappable records' files are byte-identical"
      - type: exec
        script: "{{.runtime}} exec {{.container}} sh -c '{{.lola}} list -C /work/proj --plain | tr \"\\t\" \" \"'"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "review claude-code ok"
          - result.systemout ShouldContainSubstring "review gemini-cli ok"
          - result.systemout ShouldContainSubstring "review opencode ok"
          - result.systemout ShouldNotContainSubstring "kit claude-code"
          - result.systemout ShouldContainSubstring "rooted claude-code ok"
      - type: exec
        script: "{{.runtime}} exec {{.container}} grep -c 'lola market off --add http://127.0.0.1:8765/market.git --path catalog.yml --json' /tmp/result.json"
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: "{{.runtime}} exec {{.container}} sh -c '{{.lola}} market --plain | tr \"\\t\" \" \"'"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "general lola-yaml 1 0 "
          - result.systemout ShouldContainSubstring " http://127.0.0.1:8765/market.git  catalog.yml"
          - result.systemout ShouldNotContainSubstring "off lola-yaml"
      - type: exec
        script: "{{.runtime}} exec {{.container}} sh -c 'test -f /work/proj/.claude/commands/rooted.md && test ! -e /work/proj/.claude/commands/inner.md'"
        assertions:
          - result.code ShouldEqual 0

  - name: A second run has nothing to migrate and lists what it keeps
    steps:
      - type: exec
        script: "{{.runtime}} exec {{.container}} {{.lola}} migrate -y"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "nothing to migrate"
          - result.systemout ShouldContainSubstring "owned by lola-go module review"
          - result.systemout ShouldContainSubstring "2 record(s) lola-go cannot migrate are still in installed.yml"
          - 'result.systemout ShouldContainSubstring "already registered: general from http://127.0.0.1:8765/market.git"'

  - name: The hint for the disabled marketplace registers it
    steps:
      - type: exec
        script: "{{.runtime}} exec {{.container}} {{.lola}} market off --add http://127.0.0.1:8765/market.git --path catalog.yml"
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: "{{.runtime}} exec {{.container}} {{.lola}} migrate --dry-run"
        assertions:
          - result.code ShouldEqual 0
          - 'result.systemout ShouldContainSubstring "already registered: off from http://127.0.0.1:8765/market.git"'

  - name: A home with only what migrates moves to the trash
    steps:
      - type: exec
        script: "{{.runtime}} exec {{.b_env}} {{.container}} bash /e2e/scripts/python-setup-b.sh"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "python lola installed"
      - type: exec
        script: "{{.runtime}} exec {{.b_env}} {{.container}} sh -c 'python3 /e2e-common/snapshot.py /tmp/b-before.json /home/b && {{.lola}} migrate -y --json > /tmp/b.json'"
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: "{{.runtime}} exec {{.b_env}} {{.container}} python3 /e2e/scripts/check.py /tmp/b-before.json /tmp/b.json --home-action move"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldNotContainSubstring "FAIL"
          - result.systemout ShouldContainSubstring "ok the Python home action is move"
      - type: exec
        script: "{{.runtime}} exec {{.b_env}} {{.container}} {{.lola}} migrate -y"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "nothing to migrate"

  - name: C1 A home from another machine leaves its missing project and assistant as they are, and gives the run that maps them
    steps:
      - type: exec
        script: "{{.runtime}} exec {{.c_env}} {{.container}} bash /e2e/scripts/python-setup-c.sh"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "python lola installed"
      - type: exec
        script: "{{.runtime}} exec {{.c_env}} {{.container}} {{.lola}} migrate -n"
        assertions:
          - result.code ShouldEqual 0
          - 'result.systemout ShouldContainSubstring "unmappable review (claude-code at /home/olduser/proj): project_path /home/olduser/proj no longer exists"'
          - 'result.systemout ShouldContainSubstring "unmappable review (claude-code): claude-code is not installed here"'
          - 'result.systemout ShouldContainSubstring "unmappable kit (claude-code): claude-code is not installed here"'
          - 'result.systemout ShouldContainSubstring "nothing to migrate at user scope: 2 record(s) left as they are"'
          - 'result.systemout ShouldContainSubstring "→ map what this machine lacks: lola migrate --dry-run --map-root /home/olduser=/home/c --map-target claude-code=opencode"'

  - name: C2 The mapped run migrates the moved project and the missing assistant's modules, and sync works right after
    steps:
      - type: exec
        script: "{{.runtime}} exec {{.c_env}} {{.container}} sh -c '{{.lola}} migrate -y --json --map-root /home/olduser=/home/c --map-target claude-code=opencode > /tmp/c.json'"
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: |
          {{.runtime}} exec {{.container}} python3 -c '
          import json
          doc = json.load(open("/tmp/c.json"))
          dests = {d.get("root") or "user": d for d in doc["destinations"]}
          assert dests["/home/c/proj"]["status"] == "migrated", dests["/home/c/proj"]
          assert [i["targets"] for i in dests["/home/c/proj"]["installs"]] == [["claude-code"]], dests["/home/c/proj"]["installs"]
          assert dests["user"]["status"] == "migrated", dests["user"]
          assert {i["source"]: i["targets"] for i in dests["user"]["installs"]} == {"/e2e/fixtures/review": ["opencode"], "/home/c/src/kit": ["opencode"]}, dests["user"]["installs"]
          assert doc["summary"] == {"migrated": 3, "already": 0, "left": 0, "failed": 0}, doc["summary"]
          assert doc["remap"] == "", doc["remap"]
          print("ok the moved project and the missing assistant migrated")
          '
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldEqual "ok the moved project and the missing assistant migrated"
      - type: exec
        script: "{{.runtime}} exec {{.c_env}} {{.container}} {{.lola}} sync --user"
        assertions:
          - result.code ShouldEqual 0
          - result.systemerr ShouldNotContainSubstring "no user.yml"
      - type: exec
        script: "{{.runtime}} exec {{.c_env}} {{.container}} sh -c '{{.lola}} list --user --plain | tr \"\\t\" \" \"; {{.lola}} list -C /home/c/proj --plain | tr \"\\t\" \" \"'"
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "review opencode ok"
          - result.systemout ShouldContainSubstring "kit opencode ok"
          - result.systemout ShouldContainSubstring "review claude-code ok"
