version: '3'

includes:
  go:
    taskfile: .taskfiles/go.yml
  e2e:
    taskfile: .taskfiles/e2e.yml
  release:
    taskfile: .taskfiles/release.yml

vars:
  APP_NAME: '{{.APP_NAME | default "lola"}}'
  TEST_DIR: '{{.TEST_DIR | default ".test-output"}}'

tasks:
  default:
    silent: true
    cmd: |
      task --list 2>/dev/null

  build:
    desc: "Alias for go:build"
    cmds:
      - task: go:build

  test:
    desc: "Alias for go:test (MODE=llm for errors-only output)"
    cmds:
      - task: go:test

  lint:
    desc: "Alias for go:lint"
    cmds:
      - task: go:lint

  fmt:
    desc: "Alias for go:fmt"
    cmds:
      - task: go:fmt

  cross:
    desc: "Alias for go:cross"
    cmds:
      - task: go:cross

  vuln:
    desc: "Alias for go:vuln"
    cmds:
      - task: go:vuln

  check:
    desc: Run all quality gates (lint, test, cross, vuln)
    deps: [lint, test, cross, vuln]

  clean:
    desc: Remove build artifacts and test output
    cmd: rm -rf bin/ .tools/ {{.TEST_DIR}}
