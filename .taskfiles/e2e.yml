version: '3'

# The container-driven e2e suites (e2e/<suite>/), run by scripts/e2e.sh: `task e2e` runs all of
# them, `task e2e -- <suite>...` some. They need podman (or docker), venom and, the first time,
# the network to build the image; they skip with a message when no container runtime is on PATH.
# They are not part of `task check`; the release checklist requires them.

vars:
  # OUT_DIR, not TEST_DIR: the task exports TEST_DIR, which would be re-templated.
  OUT_DIR: '{{.ROOT_DIR}}/{{.TEST_DIR | default ".test-output"}}'
  MODE: '{{.MODE | default "human"}}'

env:
  GIT_CONFIG_GLOBAL: /dev/null
  GIT_CONFIG_SYSTEM: /dev/null
  GIT_AUTHOR_NAME: lola-test
  GIT_AUTHOR_EMAIL: lola-test@invalid
  GIT_COMMITTER_NAME: lola-test
  GIT_COMMITTER_EMAIL: lola-test@invalid

tasks:
  default:
    desc: Run the container suites against the built binary (MODE=human|llm; -- <suite>... for some); artifacts in .test-output/e2e-<suite>/
    dir: '{{.ROOT_DIR}}'
    env: {MODE: '{{.MODE}}', TEST_DIR: '{{.OUT_DIR}}'}
    cmd: bash "{{.ROOT_DIR}}/scripts/e2e.sh" {{.CLI_ARGS}}
