version: '3'

vars:
  # git-cliff is pinned by version and SHA-512 in scripts/install-git-cliff.sh and installed
  # into this gitignored directory, so every maintainer renders notes with the same release.
  TOOLS_DIR: '{{.ROOT_DIR}}/.tools/bin'
  GIT_CLIFF: '{{.ROOT_DIR}}/.tools/bin/git-cliff'
  GIT_CLIFF_VERSION: 2.14.2

env:
  # git-cliff warns on every run that the commits before the Conventional Commits convention
  # were skipped; that is by design (cliff.toml: filter_unconventional). Errors still print.
  RUST_LOG: error

tasks:
  default:
    silent: true
    cmd: |
      task --list 2>/dev/null

  tools:
    desc: Install the pinned git-cliff into .tools/bin (checks its SHA-512)
    dir: '{{.ROOT_DIR}}'
    cmd: bash "{{.ROOT_DIR}}/scripts/install-git-cliff.sh" "{{.TOOLS_DIR}}"
    status:
      - '"{{.GIT_CLIFF}}" --version | grep -qx "git-cliff {{.GIT_CLIFF_VERSION}}"'

  notes:
    desc: Print the notes the next release's tag would carry (read-only)
    dir: '{{.ROOT_DIR}}'
    deps: [tools]
    cmd: '"{{.GIT_CLIFF}}" --config cliff.toml --unreleased --strip all'

  # Usage: task release:bump [-- X.Y.Z]
  bump:
    desc: "Regenerate CHANGELOG.md, commit it and tag vX.Y.Z with the notes (prompts for the version; never pushes). Usage: task release:bump [-- 0.1.0]"
    dir: '{{.ROOT_DIR}}'
    deps: [tools]
    # interactive so the version prompt reaches the terminal unbuffered.
    interactive: true
    vars:
      ARGS: '{{.ARGS | default .CLI_ARGS}}'
    cmd: bash "{{.ROOT_DIR}}/scripts/release-bump.sh" "{{.GIT_CLIFF}}" {{.ARGS}}
