# Runs `task check` (lint, test, cross, vuln, flows): the same gate a maintainer runs locally.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@v2
      - run: task check MODE=llm
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-output
          path: .test-output/
          if-no-files-found: ignore
